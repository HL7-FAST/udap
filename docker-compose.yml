
services:
  identityserver:
    image: fast-udap-security
    build:
      context: .
      dockerfile: IdentityServer/Dockerfile
      args:
        SANDBOX_BASE_PATH: ${SANDBOX_BASE_PATH:-/sandbox}
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - HEALTHCHECK_URL=https://localhost:5001/health
      - ASPNETCORE_ENVIRONMENT=Development
      - AppConfig__SeedData=true
      - AppConfig__UdapIdpBaseUrl=https://localhost:5001
      - AppConfig__SystemAdminPassword=Password1
      - AppConfig__UdapAdminPassword=Password1
      - AppConfig__SandboxFhirServerUrl=${SANDBOX_FHIR_SERVER_URL:-http://host.docker.internal:8080/fhir}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
    - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
